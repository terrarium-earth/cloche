            .findAll { artifact -> artifact.moduleVersion.id.group != 'earth.terrarium.cloche.snr.t014' }*.file)
}
class ForgeScenarioOrchestrator implements org.gradle.api.Action<org.gradle.api.Task>, Serializable {
    private static final long serialVersionUID = 1L
    private final String gradlePath
    private final String projectDirPath
    private final boolean windows
    private final String forgeTypeEntry
    private final String forgeTypeName
    private final String forgeFixtureDependency

    ForgeScenarioOrchestrator(String gradlePath, String projectDirPath, boolean windows,
                               String forgeTypeEntry, String forgeTypeName, String forgeFixtureDependency) {
        this.gradlePath = gradlePath
        this.projectDirPath = projectDirPath
        this.windows = windows
        this.forgeTypeEntry = forgeTypeEntry
        this.forgeTypeName = forgeTypeName
        this.forgeFixtureDependency = forgeFixtureDependency
    }

    @Override
    void execute(org.gradle.api.Task ignored) {
        System.out.println 'SNR-T022 Groovy callable: DependencyHandlerExtensionsKt.forgeMinecraft(project, ...) exercises the public Project helper API.'
        System.out.println 'SNR-T022 nested Forge helper runs intentionally omit --offline because Forge userdev/helper artifacts may be uncached.'
        run('without-helper')
        run('with-helper')
    }

    private void run(String variant) {
        def arguments = [gradlePath, '-p', projectDirPath, 'verifyForgePatchedMinecraftOutput', '--no-configuration-cache', '--refresh-dependencies', '--console=plain', "-PsnrForgePatchedVariant=${variant}".toString()]
        def command = (windows ? ['cmd', '/c'] + arguments : arguments)*.toString()
        def process = new ProcessBuilder(command).directory(new File(projectDirPath)).redirectErrorStream(true).start()
        def text = process.inputStream.getText('UTF-8')
        def exitValue = process.waitFor()
        if (variant == 'without-helper') {
            assert exitValue != 0: "Expected isolated Forge helper failure for ${variant}:\n${text}"
            def hasForgeType = text.contains(forgeTypeEntry) || text.contains(forgeTypeName)
            def hasForgeContext = text.contains(forgeFixtureDependency)
            def invalidOutputRejected = text.contains('SNR-T022 without-helper invalid output rejected:') && hasForgeType && hasForgeContext
            def remapFailureDiagnosed = hasForgeType && hasForgeContext && !text.contains('SNR-T022 without-helper invalid output rejected:')
            assert invalidOutputRejected || remapFailureDiagnosed:
                    "Missing validated ${forgeTypeName} remap failure or invalid-output rejection for ${variant}:\n${text}"
            System.out.println "SNR-T022 without-helper expected negative: ${invalidOutputRejected ? 'invalid-output-rejection' : 'remap-failure'}; fixture=${forgeFixtureDependency}"
        } else {
            assert exitValue == 0: "Unexpected isolated Forge helper exit ${exitValue} for ${variant}:\n${text}"
            ['SNR-T022 with-helper success', 'SNR-T022 containment passed'].each { identifier ->
                assert text.contains(identifier): "Missing Forge helper evidence '${identifier}' for ${variant}:\n${text}"
            }
        }
        text.readLines().findAll { it.contains('SNR-T022') }.each { System.out.println it }
    }
}

tasks.register('verifyForgePatchedMinecraftOutput') {
    group = 'verification'
    description = 'Verifies one Forge patched Minecraft helper variant for SNR-T022.'
    dependsOn fixturePublicationTasks, environmentTasks, targetAPackageTasks
    inputs.file(forgePatchedPomFile).withPropertyName('forgePatchedPom')
    doLast {
        assert forgePatchedVariant in ['without-helper', 'with-helper']: "Set -PsnrForgePatchedVariant=without-helper or with-helper"
        assertForgePatchedPom()

        def helperFiles = canonicalJarFiles(forgePatchedMinecraftFiles.files)
        assert helperFiles.size() == 1: "Expected exactly one Forge patched Minecraft helper JAR, got ${helperFiles}"
        def helperJar = helperFiles[0]
        assert jarContainsEntry(helperJar, forgePatchedTypeEntry): "${forgePatchedTypeEntry} missing from helper ${helperJar}"

        def remapConfiguration = targetConfiguration('target-a', 'remapClasspath')
        def remapFiles = canonicalJarFiles(remapConfiguration.files)
        def remapTypeProviders = remapFiles.findAll { jarContainsEntry(it, forgePatchedTypeEntry) }
        println "SNR-T022 ${forgePatchedVariant} remapClasspath artifacts: ${remapFiles*.absolutePath}"
        println "SNR-T022 ${forgePatchedVariant} remapClasspath ${forgePatchedTypeEntry} providers: ${remapTypeProviders*.absolutePath}"
        if (forgePatchedVariant == 'with-helper') {
            assert remapFiles.contains(helperJar): "Helper JAR missing from remapClasspath: ${remapFiles}"
            assert remapTypeProviders == [helperJar]: "Expected only helper to provide ${forgePatchedTypeEntry} on remapClasspath: ${remapTypeProviders}"
        } else {
            assert !remapFiles.contains(helperJar): "Helper JAR unexpectedly present without helper variant"
            assert remapTypeProviders.empty: "Ordinary remapClasspath provided ${forgePatchedTypeEntry}: ${remapTypeProviders}"
        }
        def ordinaryEnvironmentFiles = ordinaryEnvironmentArtifactFiles()
        println "SNR-T022 ordinary environment artifact set (targetACompileClasspath non-fixture resolved artifacts): ${ordinaryEnvironmentFiles*.absolutePath}"
        assertNoJarContainsEntry(ordinaryEnvironmentFiles, forgePatchedTypeEntry, 'enumerated ordinary Fabric target environment')

        def compileConfiguration = targetConfiguration('target-a', 'compileClasspath')
        def fixtureArtifact = compileConfiguration.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.name == 'fixture-srg'
        }
        assert fixtureArtifact: "Missing fixture-srg artifact from target-a compile classpath"
        assert fixtureArtifact.moduleVersion.id.version == forgePatchedFixtureVersion:
                "target-a did not consume ${forgePatchedFixtureSrgDependency}: ${fixtureArtifact.moduleVersion.id}"
        def fixtureBytes = new JarFile(fixtureArtifact.file).withCloseable { jar ->
            def entry = jar.getEntry('fixture/srg/ForgePatchedMinecraftSrg.class')
            assert entry: "Missing generated Forge-patched reference class in ${fixtureArtifact.file}"
            jar.getInputStream(entry).bytes
        }
        def hasForgeReference = containsBytecodeName(fixtureBytes, forgePatchedTypeName.replace('.', '/'))
        new JarFile(fixtureArtifact.file).withCloseable { jar ->
            assert jar.getEntry('fixture/named/DirectNamed.class'):
                    "Selected ${forgePatchedFixtureSrgDependency} was not remapped from srg to named"
        }
        assert hasForgeReference: "Selected ${forgePatchedFixtureSrgDependency} output does not reference ${forgePatchedTypeName}"

        def runtimeConfiguration = targetConfiguration('target-a', 'runtimeClasspath')
        def finalFiles = canonicalJarFiles(compileConfiguration.files + runtimeConfiguration.files)
        assert !finalFiles.contains(helperJar): "Helper JAR leaked into final Fabric classpaths: ${helperJar}"
        assertNoJarContainsEntry(finalFiles, forgePatchedTypeEntry, 'final Fabric compile/runtime classpaths')

        if (forgePatchedVariant == 'without-helper') {
            throw new GradleException("SNR-T022 without-helper invalid output rejected: type=${forgePatchedTypeEntry}; fixture=${forgePatchedFixtureSrgDependency}; unresolved reference remains in selected output")
        }

        def packageFiles = canonicalJarFiles(targetAPackageTasks.collect { it.get().archiveFile.get().asFile })
        assert !packageFiles.contains(helperJar): "Helper JAR leaked into Fabric packaging: ${helperJar}"
        assertNoJarContainsEntry(packageFiles, forgePatchedTypeEntry, 'Fabric packaging')

        [configurations.targetAApiElements, configurations.targetARuntimeElements].each { configuration ->
            assert configuration.allDependencies.every { dependency -> dependency.group != 'net.minecraftforge' && dependency.name != helperJar.name }:
                    "Helper dependency leaked into publication metadata ${configuration.name}: ${configuration.allDependencies}"
            def outgoingFiles = canonicalJarFiles(configuration.outgoing.artifacts.files.files)
            assert !outgoingFiles.contains(helperJar): "Helper artifact leaked into publication outputs ${configuration.name}: ${outgoingFiles}"
        }

        def transformedFiles = canonicalJarFiles(targetFixtureArtifacts('target-a')*.file)
        assert !transformedFiles.contains(helperJar): "Helper JAR was selected as a transformed output"
        assertNoJarContainsEntry(transformedFiles, forgePatchedTypeEntry, 'transformed dependency outputs')
        println "SNR-T022 with-helper success: type=${forgePatchedTypeEntry}; helper=${helperJar.name}; sha256=${sha256(helperJar)}"
        println 'SNR-T022 containment passed: final classpaths, packaging, publication metadata, and transformed outputs exclude helper JAR'
    }
}

