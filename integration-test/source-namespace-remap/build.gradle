tasks.register('verifyMissingAnalysisInputArtifact') {
    group = 'verification'
    dependsOn fixturePublicationTasks, mappingTasks, environmentTasks
    doLast {
        def expectedNames = [
                'ordinary-compile': ['compileOrdinarySrg', 'compileOrdinaryNamed'],
                'ordinary-runtime': ['runtimeOrdinarySrg', 'runtimeOrdinaryNamed'],
                'remap-classpath' : ['remapLinkageSrg', 'remapLinkageNamed']
        ][missingSource]
        assert expectedNames: "Expected one controlled snrMissingSource variant, got ${missingSource}"
        def configuration = targetConfiguration('target-a', missingSource == 'ordinary-runtime' ? 'runtimeClasspath' : 'compileClasspath')
        def bytes = fixtureClassBytes(configuration, 'fixture-srg', 'fixture/named/DirectNamed.class')
        assert containsBytecodeName(bytes, expectedNames[0]): "Missing ${missingSource} did not retain ${expectedNames[0]}"
        assert !containsBytecodeName(bytes, expectedNames[1]): "Missing ${missingSource} unexpectedly produced ${expectedNames[1]}"
    }
}

