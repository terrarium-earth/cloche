tasks.register('verifyOverrideHierarchyRemap') {
    group = 'verification'
    description = 'Verifies the generated three-level override hierarchy remaps its SRG override declaration.'
    dependsOn fixturePublicationTasks, environmentTasks
    inputs.file(rawFixtureSrgJar).withPropertyName('rawFixtureSrgJar')
    inputs.files(targetACompileClasspath).withPropertyName('targetACompileClasspath')
    doLast {
        def rawFixture = rawFixtureSrgJar.get().asFile.canonicalFile
        def compileClasspath = targetACompileClasspath
        def transformedJar = compileClasspath.find { file ->
            file.name.endsWith('.jar') && new JarFile(file).withCloseable { jar -> jar.getEntry('fixture/srg/OverrideSrg.class') }
        }?.canonicalFile
        assert transformedJar: "Missing named fixture-srg:${fixtureVersion} artifact on target-a compileClasspath"
        assert transformedJar != rawFixture: "target-a selected the raw fixture-srg JAR: ${rawFixture}"
        new JarFile(transformedJar).withCloseable { jar ->
            assert jar.getEntry('fixture/srg/OverrideSrg.class'): "Missing OverrideSrg from transformed fixture: ${transformedJar}"
        }

        def raw = javapOutput(rawFixture, 'fixture.srg.OverrideSrg')
        assert raw.contains('extends fixture.analysis.ForgeIntermediate')
        assert raw.contains('java.lang.String compileOrdinarySrg();')
        assert !raw.contains('compileOrdinaryNamed')

        def transformed = javapOutput(transformedJar, 'fixture.srg.OverrideSrg')
        assert transformed.contains('extends fixture.analysis.ForgeIntermediate')
        assert transformed.contains('java.lang.String compileOrdinaryNamed();')
        assert !transformed.contains('compileOrdinarySrg')
    }
}

tasks.register('verifySourceNamespaceRemapT016') {
    group = 'verification'
    description = 'Verifies independent real Fabric loader environments and cache/output identity.'
    dependsOn fixturePublicationTasks, environmentTasks
    doLast {
        def loadersA = targetLoaderArtifacts('target-a')
        def loadersB = targetLoaderArtifacts('target-b')
        assert loadersA && loadersA.every { it.moduleVersion.id.version == '0.15.7' }: "target-a loader mismatch: ${loadersA*.moduleVersion.id}"
        assert loadersB && loadersB.every { it.moduleVersion.id.version == '0.15.11' }: "target-b loader mismatch: ${loadersB*.moduleVersion.id}"
        def loaderHashesA = loadersA.collect { sha256(it.file) }.toSet()
        def loaderHashesB = loadersB.collect { sha256(it.file) }.toSet()
        assert loaderHashesA.size() == 1 && loaderHashesB.size() == 1 && loaderHashesA != loaderHashesB: 'Fabric loader artifacts must differ'
        (loadersA + loadersB).each { artifact -> new JarFile(artifact.file).withCloseable { jar -> assert jar.getEntry('net/fabricmc/loader/api/FabricLoader.class') != null } }
        def srgA = targetFixtureArtifacts('target-a').find { it.moduleVersion.id.name == 'fixture-srg' }
        def srgB = targetFixtureArtifacts('target-b').find { it.moduleVersion.id.name == 'fixture-srg' }
        assert srgA && srgB && srgA.moduleVersion.id == srgB.moduleVersion.id: 'Raw fixture identity changed between targets'
        assert srgA.moduleVersion.id.version == fixtureVersion: "Target isolation must consume ordinary fixture-srg:${fixtureVersion}, got ${srgA.moduleVersion.id}"
        def namespaceAttribute = Attribute.of('earth.terrarium.cloche.remapSourceNamespace', String)
        ['target-a', 'target-b'].each { targetName ->
            def requests = targetResolvableConfigurations(targetName).collectMany { it.incoming.resolutionResult.allDependencies }.findAll { it instanceof ResolvedDependencyResult && it.requested instanceof ModuleComponentSelector && it.requested.module == 'fixture-srg' }
            assert requests && requests.every { it.requested.attributes.getAttribute(namespaceAttribute) == 'srg' }: "${targetName} namespace request mismatch"
            assert targetNamedOutputs(targetName): "${targetName} has no named output"
        }
    }
}

