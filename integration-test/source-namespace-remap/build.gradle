            compileOnly("earth.terrarium.cloche.snr.t014:fixture-policy-helper:${fixtureVersion}")
            if (missingSource != 'ordinary-compile') {
                implementation("earth.terrarium.cloche.snr.t014:fixture-ordinary-compile:${fixtureVersion}")
            }
            if (missingSource != 'ordinary-runtime') {
                runtimeOnly("earth.terrarium.cloche.snr.t014:fixture-ordinary-runtime:${fixtureVersion}")
            }
            if (missingSource != 'remap-classpath') {
                remapClasspath("earth.terrarium.cloche.snr.t014:fixture-remap-root:${fixtureVersion}")
            }
            if (forgePatchedVariant == 'with-helper') {
                remapClasspath(forgePatchedMinecraftFiles)
            }
            if (invalidCase == 'blank') {
                modImplementation(remapFrom('   ')('invalid:blank:1'))
            } else if (invalidCase == 'named') {
                modImplementation(remapFrom('named')('invalid:named:1'))
            } else if (invalidCase == 'project') {
                modImplementation(remapFrom('srg')(project(':fixture-srg')))
            } else if (invalidCase == 'file') {
                modImplementation(remapFrom('srg')(files('mappings/source-namespace-remap.tiny')))
            } else if (invalidCase == 'conflict') {
                modImplementation(remapFrom('srg')(fixtureSrgDependency))
                modImplementation(remapFrom('official')(fixtureSrgDependency))
            } else if (invalidCase == 'missing-mapping') {
                modImplementation(remapFrom('missing-source')("earth.terrarium.cloche.snr.t014:fixture-child:${fixtureVersion}"))
            } else if (invalidCase == 'unresolved-remap-classpath') {
                remapClasspath('earth.terrarium.cloche.snr.invalid:missing-remap-linkage:404')
            }
        }
    }
    fabric('target-b') {
        minecraftVersion = '1.20.3'
        loaderVersion = '0.15.11'
        mappings {
            custom(dependencies.create(files('mappings/source-namespace-remap.tiny')))
        }
        dependencies {
            modImplementation("earth.terrarium.cloche.snr.t014:fixture-default:${fixtureVersion}")
