def rawFixtureSrgJar = project(':fixture-srg').tasks.named('jar').flatMap { it.archiveFile }
def runNested = { String taskName, Map properties, boolean expectFailure, List<String> required ->
    def arguments = [verificationGradle.absolutePath, '-p', rootDir.absolutePath, taskName, '--no-configuration-cache', '--offline']
    properties.each { key, value -> arguments << "-P${key}=${value}".toString() }
    def command = (System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c'] + arguments : arguments)*.toString()
    def process = new ProcessBuilder(command).directory(rootDir).redirectErrorStream(true).start()
    def text = process.inputStream.getText('UTF-8')
    def exitValue = process.waitFor()
    assert (exitValue != 0) == expectFailure: "Unexpected isolated exit ${exitValue} for ${taskName}:\n${text}"
    required.each { identifier ->
        assert text.contains(identifier): "Missing diagnostic identifier '${identifier}' for ${taskName}:\n${text}"
    }
}
def fixtureClassBytes = { Configuration configuration, String module, String entry ->
    def artifact = fixtureModules(configuration).find { it.moduleVersion.id.name == module }
    assert artifact: "Missing fixture artifact ${module} in ${configuration.name}"
    new JarFile(artifact.file).withCloseable { jar ->
        def classEntry = jar.getEntry(entry)
        assert classEntry: "Missing ${entry} in ${artifact.file}"
        jar.getInputStream(classEntry).bytes
    }
}
def containsBytecodeName = { byte[] bytes, String value -> new String(bytes, 'ISO-8859-1').contains(value) }
def assertDirectNamedBytecode = { Configuration configuration ->
    def bytes = fixtureClassBytes(configuration, 'fixture-srg', 'fixture/named/DirectNamed.class')
    ['compileOrdinaryNamed', 'runtimeOrdinaryNamed', 'remapLinkageNamed'].each { name ->
        assert containsBytecodeName(bytes, name): "${configuration.name} DirectNamed.class lacks ${name}"
    }
    ['compileOrdinarySrg', 'runtimeOrdinarySrg', 'remapLinkageSrg'].each { name ->
        assert !containsBytecodeName(bytes, name): "${configuration.name} DirectNamed.class retained stale ${name}"
    }
}

def verifySourceNamespaceRemap = tasks.register('verifySourceNamespaceRemap') {
    group = 'verification'
    description = 'Publishes external fixtures and verifies mixed and edge-local source namespace remapping.'
    dependsOn fixturePublicationTasks, environmentTasks

    doLast {
        def compileClasspath = targetConfiguration('target-a', 'compileClasspath')
        def artifacts = compileClasspath.resolvedConfiguration.resolvedArtifacts
        def fixtureArtifacts = artifacts.findAll { it.moduleVersion.id.group == 'earth.terrarium.cloche.snr.t014' }
        def byName = fixtureArtifacts.collectEntries { [(it.moduleVersion.id.name): it.file] }
        assert byName.keySet().containsAll(['fixture-default', 'fixture-srg', 'fixture-child']): "Expected all external fixture modules, got ${byName.keySet()}"
        assert fixtureArtifacts.every { it.id.componentIdentifier instanceof ModuleComponentIdentifier }
        def entries = byName.collectEntries { name, file -> [(name): new JarFile(file).withCloseable { jar -> jar.entries()*.name as Set }] }
        assert 'fixture/named/DefaultNamed.class' in entries['fixture-default']
        assert 'fixture/named/DirectNamed.class' in entries['fixture-srg']
        assert 'fixture/srg/ForgePatchedMinecraftSrg.class' !in entries['fixture-srg']
        assert 'fixture/named/ChildNamed.class' in entries['fixture-child']
        assert 'fixture/srg/DirectSrg.class' !in entries['fixture-srg']
        assert 'fixture/srg/ChildSrg.class' !in entries['fixture-child']
        def srgAttribute = Attribute.of('earth.terrarium.cloche.remapSourceNamespace', String)
        def directRequests = compileClasspath.incoming.resolutionResult.allDependencies.findAll { it instanceof ResolvedDependencyResult && it.requested instanceof ModuleComponentSelector && it.requested.group == 'earth.terrarium.cloche.snr.t014' }.collectEntries { dependency -> [(dependency.requested.module): dependency.requested.attributes.getAttribute(srgAttribute)] }
        assert directRequests['fixture-srg'] == 'srg'
        assert directRequests['fixture-default'] == null
        assert directRequests['fixture-child'] == null
        def loaderRequests = compileClasspath.incoming.resolutionResult.allDependencies.findAll { it instanceof ResolvedDependencyResult && it.requested instanceof ModuleComponentSelector && it.requested.group == 'net.fabricmc' && it.requested.module == 'fabric-loader' }
        assert !loaderRequests.empty
        assert loaderRequests.every { it.requested.attributes.getAttribute(srgAttribute) != 'srg' }
    }
}

def fixtureModules(Configuration configuration) {
    configuration.resolvedConfiguration.resolvedArtifacts.findAll {
        it.moduleVersion.id.group == 'earth.terrarium.cloche.snr.t014'
    }
}

def fixtureEntries(Configuration configuration) {
    fixtureModules(configuration).collectEntries { artifact ->
        [(artifact.moduleVersion.id.name): new JarFile(artifact.file).withCloseable { jar -> jar.entries()*.name as Set }]
    }
}

def verifyNoAnalysisLeak(Configuration configuration) {
    def names = fixtureModules(configuration)*.moduleVersion.id.name as Set
    assert !names.contains('fixture-remap-root'):
            "Analysis-only remapClasspath root leaked into ${configuration.name}: ${names}"
}

['verifyCompleteCompileInputs': 'targetACompileClasspath', 'verifyCompleteRuntimeInputs': 'targetARuntimeClasspath'].each { taskName, configurationName ->
