def canonicalJarFiles = { Collection<File> files -> files.findAll { it.isFile() && it.name.endsWith('.jar') }.collect { it.canonicalFile }.unique { it.path } }
def jarContainsEntry = { File file, String entry -> file.isFile() && file.name.endsWith('.jar') && new JarFile(file).withCloseable { jar -> jar.getEntry(entry) != null } }
def assertNoJarContainsEntry = { Collection<File> files, String entry, String role ->
    def hits = files.findAll { jarContainsEntry(it, entry) }
    assert hits.empty: "Forge patched helper type leaked into ${role}: ${hits}"
}
def assertForgePatchedPom = {
    def pomFile = forgePatchedPomFile.get().asFile
    assert pomFile.isFile(): "Missing generated Forge publication POM: ${pomFile}"
    def dependencies = new XmlParser(false, false).parse(pomFile).dependencies.dependency
    assert dependencies.size() == 1: "Expected exactly one Forge publication POM dependency in ${pomFile}, got ${dependencies.size()}"
    def dependency = dependencies[0]
    def actual = [
            groupId   : dependency.groupId.text(),
            artifactId: dependency.artifactId.text(),
            version   : dependency.version.text(),
            scope     : dependency.scope.text()
    ]
    def expected = [
            groupId   : 'earth.terrarium.cloche.snr.t014',
            artifactId: 'fixture-child',
            version   : fixtureVersion,
            scope     : 'compile'
    ]
    assert actual == expected: "Unexpected Forge publication POM dependency in ${pomFile}: ${actual}"
    println "SNR-T022 ${forgePatchedVariant} Forge publication POM dependency: ${actual}"
}
def ordinaryEnvironmentArtifactFiles = {
