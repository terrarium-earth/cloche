            if (missingSource != 'ordinary-compile') {
                implementation("earth.terrarium.cloche.snr.t014:fixture-ordinary-compile:${fixtureVersion}")
            }
            if (missingSource != 'ordinary-runtime') {
                runtimeOnly("earth.terrarium.cloche.snr.t014:fixture-ordinary-runtime:${fixtureVersion}")
            }
            if (missingSource != 'remap-classpath') {
                remapClasspath("earth.terrarium.cloche.snr.t014:fixture-remap-root:${fixtureVersion}")
            }
        }
    }
}

