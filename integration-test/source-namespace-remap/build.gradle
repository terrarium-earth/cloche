tasks.register('verifyInputSelfExclusion') {
    group = 'verification'
    dependsOn tasks.named('verifyCompleteCompileInputs')
    doLast {
        def raw = project(':fixture-srg').tasks.named('jar').get().archiveFile.get().asFile.canonicalFile
        def named = fixtureModules(targetConfiguration('target-a', 'compileClasspath')).find { it.moduleVersion.id.name == 'fixture-srg' }.file.canonicalFile
        assert raw != named: "Remap input was consumed as its own named output: ${raw}"
        assert !targetConfiguration('target-a', 'remapClasspath').files*.canonicalFile.contains(raw): "Remap input leaked into remapClasspath: ${raw}"
    }
}
